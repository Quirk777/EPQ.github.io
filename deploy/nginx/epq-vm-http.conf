# Temporary HTTP-only Nginx site for first Certbot issuance on the VM.
# Replace example.com with your production domain.

upstream epq_frontend_vm_bootstrap {
    server 127.0.0.1:3000;
}

upstream epq_backend_vm_bootstrap {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /healthz {
        proxy_pass http://epq_backend_vm_bootstrap/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }

    location / {
        proxy_pass http://epq_frontend_vm_bootstrap;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }
}
