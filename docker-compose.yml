services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-epq}
      POSTGRES_USER: ${POSTGRES_USER:-epq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-epq_user} -d ${POSTGRES_DB:-epq}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # DATABASE_URL switches the backend from local SQLite to PostgreSQL.
      DATABASE_URL: postgresql://${POSTGRES_USER:-epq_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-epq}
      ENVIRONMENT: production
      REPORTS_DIR: /app/reports
      UPLOADS_DIR: /app/uploads
      WKHTMLTOPDF_PATH: /usr/bin/wkhtmltopdf
      HTTPS_ONLY_COOKIES: "true"
      SESSION_SAME_SITE: lax
      TRUSTED_PROXY_IPS: "*"
    volumes:
      - reports_data:/app/reports
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:8001
    depends_on:
      - backend
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/epq.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro

volumes:
  postgres_data:
  reports_data:
  uploads_data:
